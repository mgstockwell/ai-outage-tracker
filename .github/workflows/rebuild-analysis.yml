name: Rebuild analysis

# Whenever the dataset changes on main (including edits made on github.com),
# re-validate it, regenerate the JSON and the findings, and commit the result.
on:
  push:
    branches: [main]
    paths: ["data/outages.csv", "data/yearly_largest.csv", "scripts/build_data.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-analysis
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSVs and regenerate JSON + findings
        run: python scripts/build_data.py
      - name: Commit regenerated files
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/*.json README.md
          git commit -m "Rebuild analysis from updated data"
          git push
