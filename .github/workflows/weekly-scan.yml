name: Weekly outage scan

# Every Monday ~8:17am US Eastern (13:17 UTC), plus a manual "Run workflow" button.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scan"
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gather candidate outages
        run: python scripts/gather_sources.py --days "${{ github.event.inputs.days || '7' }}"

      - name: Validate dataset
        run: python scripts/build_data.py --check

      - name: Run date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Opens (or updates) one pull request with this week's candidates for you to review.
      # Requires: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
      - name: Open review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: scan/weekly-candidates
          delete-branch: true
          add-paths: data/candidates/**
          commit-message: "Outage candidates for week ending ${{ steps.date.outputs.today }}"
          title: "Outage candidates: week ending ${{ steps.date.outputs.today }}"
          body-path: data/candidates/latest.md
          labels: candidates
